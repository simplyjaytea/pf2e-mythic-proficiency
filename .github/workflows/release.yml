name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version=$v' module.json > tmp && mv tmp module.json
      - name: Zip module
        run: zip -r module.zip module.json scripts lang
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
